<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ないページを開いたときに、中継 API（worker/src/index.ts）がステータス 404 で返すページ -->
    <title>ページが見つかりません｜らくらくエントリー</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; color: #14161a; background: #fbfaf8;
        font: 15px/1.8 "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
      main { max-width: 480px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 22px; margin: 18px 0 8px; }
      p { color: #5b6470; margin: 0 0 24px; }
      ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
      a { display: inline-block; text-decoration: none; color: #14161a; background: #fff; border: 1px solid #ece9f2; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px; }
      a.dark { background: #14161a; border-color: #14161a; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/icon.svg" alt="" width="56" height="56" />
      <h1>ページが見つかりません</h1>
      <p>URL が変わったか、ページがなくなった可能性があります。</p>
      <ul>
        <li><a class="dark" href="/">トップページへ</a></li>
        <li><a href="/game">SPI 用語集</a></li>
        <li><a href="https://app.rakuraku-entry.com/companies">マイページ管理</a></li>
      </ul>
    </main>
  </body>
</html>
