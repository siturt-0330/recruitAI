<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自動入力の許可 - らくらくエントリー</title>
  </head>
  <body>
    <main class="grant">
      <div class="grant-icon" aria-hidden="true">🔑</div>
      <h1 id="title">ログイン情報を入力</h1>
      <p id="site" class="grant-site"></p>
      <button id="allow" class="grant-btn">許可して入力</button>
      <button id="cancel" class="grant-link">今回はしない</button>
      <p id="error" class="grant-error" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
