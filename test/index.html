<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecruitAI テストフォーム</title>
    <style>
      body { font-family: system-ui, 'Yu Gothic UI', sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
      h2 { font-size: 15px; margin: 28px 0 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 13px; }
      th { background: #f4f4f4; width: 150px; }
      .row { margin: 10px 0; }
      .row label { display: block; font-size: 13px; margin-bottom: 4px; }
      dl { display: grid; grid-template-columns: 150px 1fr; gap: 8px; }
      dt { font-size: 13px; }
      .hidden-radio input { display: none; }
      .hidden-radio label { border: 1px solid #aaa; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
      .req { color: #c00; font-size: 11px; margin-left: 4px; }
      #harness { position: sticky; top: 0; background: #fffbe6; border: 1px solid #e6d78a; padding: 8px 12px; border-radius: 6px; display: flex; gap: 8px; align-items: center; z-index: 10; }
      #log { white-space: pre-wrap; font: 12px monospace; background: #f7f7f7; padding: 8px; }
    </style>
  </head>
  <body>
    <div id="harness">
      <strong>テスト用</strong>
      <button id="fill">入力</button>
      <button id="undo">元に戻す</button>
      <label><input type="checkbox" id="mockAi" /> AI モック</label>
    </div>

    <h2>A. テーブル型（よくある自社フォーム）</h2>
    <form id="a">
      <table>
        <tr><th>氏名<span class="req">必須</span></th><td>姓 <input name="sei" /> 名 <input name="mei" /></td></tr>
        <tr><th>フリガナ<span class="req">必須</span></th><td>セイ <input name="sei_kana" /> メイ <input name="mei_kana" /></td></tr>
        <tr>
          <th>生年月日</th>
          <td>
            <select name="birth_y"><option value="">--</option></select>年
            <select name="birth_m"><option value="">--</option></select>月
            <select name="birth_d"><option value="">--</option></select>日
          </td>
        </tr>
        <tr>
          <th>性別</th>
          <td><label><input type="radio" name="sex" value="1" />男性</label> <label><input type="radio" name="sex" value="2" />女性</label></td>
        </tr>
        <tr><th>電話番号（ハイフンなし）</th><td><input name="tel" maxlength="11" /></td></tr>
        <tr><th>郵便番号</th><td><input name="zip1" size="3" /> - <input name="zip2" size="4" /></td></tr>
        <tr><th>都道府県</th><td><select name="pref"><option value="">選択してください</option></select></td></tr>
        <tr><th>市区町村</th><td><input name="addr1" /></td></tr>
        <tr><th>番地</th><td><input name="addr2" /></td></tr>
        <tr><th>建物名</th><td><input name="addr3" /></td></tr>
        <tr><th>メールアドレス</th><td><input name="mail" /></td></tr>
        <tr><th>メールアドレス（確認用）</th><td><input name="mail_conf" /></td></tr>
      </table>
    </form>

    <h2>B. ラベル型（ATS 風・React など）</h2>
    <form id="b">
      <div class="row"><label for="b-name">お名前</label><input id="b-name" /></div>
      <div class="row"><label for="b-kana">ふりがな</label><input id="b-kana" placeholder="やまだ たろう" /></div>
      <div class="row"><label for="b-bday">生年月日</label><input id="b-bday" type="date" /></div>
      <div class="row">
        <label>携帯電話番号</label>
        <input name="p1" size="4" /> - <input name="p2" size="4" /> - <input name="p3" size="4" />
      </div>
      <div class="row"><label for="b-zip">郵便番号</label><input id="b-zip" placeholder="123-4567" /></div>
      <div class="row"><label for="b-addr">住所</label><input id="b-addr" size="50" /></div>
      <div class="row hidden-radio">
        <label>性別</label>
        <input type="radio" id="g-m" name="gender" value="male" /><label for="g-m">男性</label>
        <input type="radio" id="g-f" name="gender" value="female" /><label for="g-f">女性</label>
        <input type="radio" id="g-o" name="gender" value="none" /><label for="g-o">回答しない</label>
      </div>
      <div class="row"><label for="b-motive">志望動機</label><textarea id="b-motive" rows="3" cols="50"></textarea></div>
    </form>

    <h2>C. dl 型・和暦・全角指定</h2>
    <form id="c">
      <dl>
        <dt>氏名（全角）</dt><dd><input name="c_name" /></dd>
        <dt>フリガナ（全角カナ）</dt><dd><input name="c_kana" /></dd>
        <dt>生年月日（和暦）</dt>
        <dd>
          <select name="c_era_y"><option value="">年</option></select>
          <select name="c_m"><option value="">月</option></select>
          <select name="c_d"><option value="">日</option></select>
        </dd>
        <dt>学校名</dt><dd><input name="c_school" /></dd>
        <dt>学部</dt><dd><input name="c_faculty" /></dd>
        <dt>学科</dt><dd><input name="c_dept" /></dd>
        <dt>卒業予定年月</dt>
        <dd><select name="c_gy"><option value="">--</option></select>年 <select name="c_gm"><option value="">--</option></select>月</dd>
      </dl>
    </form>

    <h2>D. ラベルが弱い欄（AI 向け）</h2>
    <form id="d">
      <div class="row"><input name="field_17" placeholder="例）山田" /> <input name="field_18" placeholder="例）太郎" /></div>
      <div class="row"><input name="q3" placeholder="例）taro@example.com" /></div>
    </form>

    <h2>結果</h2>
    <div id="log"></div>

    <script type="module" src="./harness.ts"></script>
  </body>
</html>
