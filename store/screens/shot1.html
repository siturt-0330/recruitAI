<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./shot.css" />
    <style>
      .form { padding: 24px 40px; font-size: 14px; }
      .form h2 { margin: 0 0 4px; font-size: 20px; }
      .form .sub { color: #536471; font-size: 12px; margin-bottom: 14px; }
      table { width: 100%; border-collapse: collapse; }
      th { width: 150px; text-align: left; font-weight: 600; font-size: 13px; padding: 9px 12px; background: #f7f9f9; border: 1px solid #e1e8ed; }
      td { padding: 7px 12px; border: 1px solid #e1e8ed; }
      td .pair { display: flex; gap: 8px; }
      input, select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid #b8c4cc; border-radius: 4px; background: #fff; }
      .pair input { width: 150px; }
      input.wide { width: 360px; }
      .s { font-size: 12px; color: #536471; margin-left: 2px; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img class="logo" src="../icon.svg" alt="" />らくらくエントリー</div>
      <h1>応募フォームを、<br />ワンクリックで。</h1>
      <p>登録したプロフィールを、企業ごとに違うフォームに合わせて入力。和暦や全角・半角も自動で合わせます。</p>
    </div>
    <div class="stage">
      <div class="window">
        <div class="chrome"><i></i><i></i><i></i><span>recruit.example.co.jp/entry</span></div>
        <div class="page">
          <div class="form">
            <h2>エントリー</h2>
            <div class="sub">2027年度 新卒採用</div>
            <table>
              <tr><th>氏名</th><td><div class="pair"><input name="sei" placeholder="姓" /><input name="mei" placeholder="名" /></div></td></tr>
              <tr><th>フリガナ</th><td><div class="pair"><input name="sei_kana" placeholder="セイ" /><input name="mei_kana" placeholder="メイ" /></div></td></tr>
              <tr><th>生年月日</th><td>
                <select name="birth_y"><option value=""></option></select><span class="s">年</span>
                <select name="birth_m"><option value=""></option></select><span class="s">月</span>
                <select name="birth_d"><option value=""></option></select><span class="s">日</span>
              </td></tr>
              <tr><th>郵便番号</th><td><input name="zip" placeholder="1500041" /></td></tr>
              <tr><th>住所</th><td><input class="wide" name="address" /></td></tr>
              <tr><th>携帯電話</th><td><input name="tel" placeholder="09012345678" /></td></tr>
              <tr><th>メールアドレス</th><td><input class="wide" name="email" type="email" /></td></tr>
              <tr><th>学校名</th><td><input class="wide" name="school" /></td></tr>
              <tr><th>学部・学科</th><td><div class="pair"><input name="faculty" placeholder="学部" /><input name="dept" placeholder="学科" /></div></td></tr>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./shot1.ts"></script>
  </body>
</html>
