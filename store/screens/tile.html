<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body { background: #f1f2fd; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 36px; box-sizing: border-box;
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; color: #0f1419; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 26px; color: #2f3380; }
      .orb { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 50%, #34386a 0%, #23264a 28%, #121322 52%, #0a0a0f 72%); }
      .orb::after { content: ''; width: 42%; height: 42%; border-radius: 50%; background: #0a0a0f; box-shadow: 0 0 0 1.5px #b9bde8, 0 0 5px 1.5px rgba(185,189,232,.55); }
      h1 { margin: 0; font-size: 28px; line-height: 1.4; font-weight: 800; }
      .stamp { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; border: 2px solid #c2412d; color: #c2412d;
        border-radius: 50%; transform: rotate(-12deg); font: 700 15px "Yu Mincho", "Hiragino Mincho ProN", serif; vertical-align: 4px; margin-left: 6px; background: #fbf8f2; }
    </style>
  </head>
  <body>
    <div class="brand"><span class="orb"></span>RecruitAI</div>
    <h1>応募フォームを、<br />ワンクリックで。<span class="stamp">済</span></h1>
  </body>
</html>
