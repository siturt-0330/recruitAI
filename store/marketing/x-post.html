<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>らくらくエントリー X 投稿画像</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<!--
  X（旧Twitter）の投稿用の横長画像（800×450 を 2 倍で 1600×900 に書き出す）。
  node store/marketing/capture.mjs store/marketing/x-post.html store/marketing/x-post.png
  ?soon を付けると、ストア公開前の「近日公開」版になる。
-->
<style>
  :root {
    --ink: #14161a; --sub: #5b6470; --line: #ece9f2; --paper: #fbfaf8; --stamp: #e0563f; --hl: #ffe45c;
    --head: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    --grad: linear-gradient(100deg, #5b4cf0 0%, #c04fd8 50%, #ff7a59 100%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans JP", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.5; }
  #stage { position: relative; width: 800px; height: 450px; overflow: hidden; background: var(--paper); }
  .abs { position: absolute; }
  .blob { border-radius: 50%; filter: blur(60px); opacity: .85; }

  .brand { left: 44px; top: 46px; display: flex; align-items: center; gap: 10px; font: 900 17px var(--head); font-feature-settings: "palt"; }
  .brand svg { width: 30px; height: 30px; display: block; }
  h1 { position: absolute; left: 44px; top: 90px; margin: 0; font: 900 42px/1.3 var(--head); letter-spacing: -.025em; }
  .mk { background: linear-gradient(transparent 62%, var(--hl) 62%); padding: 0 2px; margin: 0 -2px; }
  .lead { left: 44px; top: 270px; margin: 0; font-size: 15px; line-height: 1.75; color: var(--sub); font-weight: 500; }
  .lead b { font-weight: 900; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .label { left: 44px; top: 346px; font-size: 12px; font-weight: 700; }
  .search { left: 44px; top: 368px; width: 270px; height: 46px; border-radius: 999px; background: #fff; border: 1.5px solid #dadce0; display: flex; align-items: center; gap: 10px;
    padding: 0 18px; font-size: 17px; font-weight: 700; box-shadow: 0 8px 24px rgba(60,50,140,.1); }
  .search svg { width: 19px; height: 19px; flex-shrink: 0; }

  .win { left: 352px; top: 40px; width: 412px; height: 346px; background: #fff; border-radius: 16px;
    box-shadow: 0 24px 60px rgba(60,50,140,.18), 0 2px 8px rgba(20,22,26,.06); }
  .win-top { position: relative; height: 38px; background: #f1f3f4; border-bottom: 1px solid #e3e5e8; border-radius: 16px 16px 0 0; display: flex; align-items: center; gap: 5px; padding: 0 10px; }
  .win-top > i { width: 9px; height: 9px; border-radius: 50%; background: #ff5f57; }
  .win-top > i:nth-child(2) { background: #febc2e; }
  .win-top > i:nth-child(3) { background: #28c840; }
  .url { flex: 1; margin-left: 6px; height: 24px; border-radius: 12px; background: #fff; font-size: 11px; color: #5f6368; line-height: 24px; padding: 0 10px; white-space: nowrap; }
  .tb { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tb svg { width: 18px; height: 18px; display: block; }
  .tb.on { background: rgba(91,76,240,.16); box-shadow: 0 0 0 3px rgba(91,76,240,.18); }
  .tb.av { background: #c7b8ff; color: #3b2a8a; font-size: 11px; font-weight: 700; }
  .body { padding: 12px 18px; }
  .ftitle { font: 900 15px var(--head); margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 6px; height: 41px; }
  .row > b { width: 70px; flex-shrink: 0; font-size: 11.5px; color: #536471; font-weight: 500; white-space: nowrap; }
  .inp { position: relative; height: 28px; border: 1px solid #cfd6dc; border-radius: 6px; background: #fff; padding: 0 8px; font-size: 12.5px; display: flex; align-items: center;
    white-space: nowrap; box-shadow: 0 0 0 2px rgba(224,86,63,.2); }
  .inp.sel { padding-right: 18px; }
  .inp.sel::after { content: ""; position: absolute; right: 6px; top: 11px; border: 3.5px solid transparent; border-top: 4.5px solid #8b98a5; }
  .unit { font-size: 11px; color: #536471; }
  .stamp { position: absolute; right: -8px; top: -9px; width: 19px; height: 19px; border-radius: 50%; border: 1.4px solid var(--stamp); color: var(--stamp); background: #fffaf4;
    font: 700 10px/1 "Yu Mincho", "Hiragino Mincho ProN", serif; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); }
  .bar { left: 520px; top: 366px; display: flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 6px 6px 14px;
    font-size: 13px; font-weight: 700; box-shadow: 0 14px 30px rgba(20,22,26,.28); }
  .bar .ring { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #8f84ff; }
  .bar .undo { background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  .cursor { left: 704px; top: 66px; width: 28px; height: 28px; }
  .ripple { left: 690px; top: 46px; width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid rgba(91,76,240,.5); }
</style>
</head>
<body>
<div id="stage">
  <div class="abs blob" style="width:340px;height:340px;background:#d9d1ff;left:-120px;top:-140px"></div>
  <div class="abs blob" style="width:300px;height:300px;background:#ffd9c7;left:620px;top:220px"></div>
  <div class="abs blob" style="width:300px;height:300px;background:#c9f0de;left:200px;top:330px"></div>

  <div class="abs brand"><span class="ico"></span>らくらくエントリー</div>
  <h1>応募フォーム、<br />まだ<span class="mk">手で</span><br />入力してる？</h1>
  <p class="abs lead">らくらくエントリーなら、<br />どのフォームにも<b>ワンクリック</b>で入力。</p>
  <div class="abs label" id="label">Chrome ウェブストアで検索</div>
  <div class="abs search"><svg viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>らくらくエントリー</div>

  <div class="abs win">
    <div class="win-top"><i></i><i></i><i></i><span class="url">recruit.example.co.jp/entry</span><span class="tb on ico"></span><span class="tb av">山</span></div>
    <div class="body">
      <div class="ftitle">エントリー</div>
      <div class="row"><b>氏名</b><span class="inp" style="width:126px">山田</span><span class="inp" style="width:126px">花子</span></div>
      <div class="row"><b>フリガナ</b><span class="inp" style="width:126px">ヤマダ</span><span class="inp" style="width:126px">ハナコ</span></div>
      <div class="row"><b>生年月日</b><span class="inp sel" style="width:70px">2004</span><span class="unit">年</span><span class="inp sel" style="width:48px">5</span><span class="unit">月</span><span class="inp sel" style="width:48px">12</span><span class="unit">日</span></div>
      <div class="row"><b>住所</b><span class="inp" style="width:258px">東京都渋谷区神南1-2-3</span></div>
      <div class="row"><b>携帯電話</b><span class="inp" style="width:56px">090</span><span class="unit">-</span><span class="inp" style="width:62px">1234</span><span class="unit">-</span><span class="inp" style="width:62px">5678</span></div>
      <div class="row"><b>大学・学部</b><span class="inp" style="width:126px">〇〇大学</span><span class="inp" style="width:126px">経済学部</span></div>
    </div>
  </div>
  <div class="abs bar"><span class="ring"></span>13 件入力<span class="undo">元に戻す</span></div>
  <div class="abs ripple"></div>
  <div class="abs cursor"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M3 2 L3 20 L8 15.5 L11.5 22.5 L14.5 21 L11 14.2 L18 14.2 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
</div>
<script>
  var ICON = '<svg viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="28" fill="#0F1419"/><rect x="22" y="28" width="84" height="16" rx="8" fill="#2EE6C5"/><rect x="22" y="54" width="84" height="16" rx="8" fill="#2EE6C5"/><rect x="22" y="80" width="46" height="16" rx="8" fill="#2EE6C5" fill-opacity=".35"/><path transform="translate(74 70)" d="M0 0 v34 l8.5 -8 l6.5 14 l6.5 -3 l-6.5 -13.5 h12 z" fill="#fff" stroke="#0F1419" stroke-width="4" stroke-linejoin="round"/></svg>';
  document.querySelectorAll('.ico').forEach(function (e) { e.innerHTML = ICON; });
  document.querySelectorAll('.inp').forEach(function (e) {
    var s = document.createElement('span');
    s.className = 'stamp';
    s.textContent = '済';
    e.appendChild(s);
  });
  if (new URLSearchParams(location.search).has('soon')) document.getElementById('label').textContent = 'まもなく Chrome ウェブストアで公開';
  // 書き出し用（静止画なので動きはない）
  window.__capture = { width: 800, height: 450, scale: 2, duration: 0 };
  window.__render = function () {};
</script>
</body>
</html>
